<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">intuitive-game-design: games nobody has to read instructions for</title>
  <desc id="desc">A player's first move succeeds without a manual. A router picks one of ten paths, A to J, and every answer passes five questions.</desc>
  <style>
    .bg{fill:#f5f5f5}.surface{fill:#ffffff}.canvas{fill:#ffffff}
    .hair{stroke:#e5e5e5}.strong{stroke:#cfcfcf}.strong-f{fill:#cfcfcf}.ink-s{stroke:#0a0a0a}.mut-s{stroke:#999999}
    .ink{fill:#0a0a0a}.ink2{fill:#3d3d3d}.muted{fill:#666666}.faint{fill:#999999}
    .acc{fill:#0062cc}.acc-s{stroke:#0062cc}.acc-soft{fill:#e8f0fa}
    text{font-family:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#141414}.surface{fill:#111111}.canvas{fill:#0a0a0a}
      .hair{stroke:#262626}.strong{stroke:#3a3a3a}.strong-f{fill:#3a3a3a}.ink-s{stroke:#f2f2f2}.mut-s{stroke:#6b6b6b}
      .ink{fill:#f2f2f2}.ink2{fill:#d4d4d4}.muted{fill:#a3a3a3}.faint{fill:#6b6b6b}
      .acc{fill:#3b9cff}.acc-s{stroke:#3b9cff}.acc-soft{fill:#0f1f33}
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="420"/>

  <text class="faint mono" x="64" y="96" font-size="10" letter-spacing="1.5">FIRST 30 SECONDS · NO MANUAL</text>
  <rect class="surface hair" x="64" y="112" width="336" height="216" rx="8" stroke-width="1"/>
  <rect class="ink" x="64" y="268" width="138" height="8"/>
  <rect class="ink" x="262" y="268" width="138" height="8"/>
  <rect class="strong-f" x="202" y="268" width="60" height="8" opacity="0.25"/>
  <path class="acc-s" d="M178 252 Q 232 150, 290 252" fill="none" stroke-width="1.5" stroke-dasharray="3 5" stroke-linecap="round"/>
  <rect class="hair" x="168" y="244" width="18" height="18" rx="3" fill="none" stroke-width="1" stroke-dasharray="2 3"/>
  <rect class="ink" x="225" y="183" width="18" height="18" rx="3"/>
  <rect class="ink" x="282" y="248" width="18" height="18" rx="3" opacity="0"/>
  <path class="acc-s" d="M202 290 H222" stroke-width="1.5"/>
  <line class="acc-s" x1="202" y1="284" x2="202" y2="296" stroke-width="1"/>
  <line class="acc-s" x1="222" y1="284" x2="222" y2="296" stroke-width="1"/>
  <path class="mut-s" d="M262 290 H282" stroke-width="1.5"/>
  <line class="mut-s" x1="262" y1="284" x2="262" y2="296" stroke-width="1"/>
  <line class="mut-s" x1="282" y1="284" x2="282" y2="296" stroke-width="1"/>
  <text class="acc mono" x="150" y="312" font-size="10">coyote 120 ms</text>
  <text class="faint mono" x="262" y="312" font-size="10">buffer 100 ms</text>
  <g transform="translate(330 150)"><circle class="acc-soft acc-s" cx="0" cy="0" r="16" stroke-width="1.25"/><circle class="acc" cx="0" cy="0" r="5"/></g>
  <text class="faint mono" x="88" y="140" font-size="10" letter-spacing="1">TAP</text>
  <text class="ink2" x="88" y="160" font-size="14">One input. Zero words.</text>
  <path class="mut-s" d="M400 220 H452" fill="none" stroke-width="1.25" stroke-dasharray="3 5" stroke-linecap="round"/>
  <text class="faint mono" x="468" y="96" font-size="10" letter-spacing="1.5">ROUTER · 10 PATHS</text>
  <rect class="surface hair" x="468" y="112" width="120" height="34" rx="6" stroke-width="1"/>
  <text class="ink mono" x="480" y="134" font-size="12" font-weight="600">A</text>
  <text class="muted" x="500" y="134" font-size="13">design</text>
  <rect class="surface hair" x="468" y="156" width="120" height="34" rx="6" stroke-width="1"/>
  <text class="ink mono" x="480" y="178" font-size="12" font-weight="600">B</text>
  <text class="muted" x="500" y="178" font-size="13">diagnose</text>
  <rect class="surface hair" x="468" y="200" width="120" height="34" rx="6" stroke-width="1"/>
  <text class="ink mono" x="480" y="222" font-size="12" font-weight="600">C</text>
  <text class="muted" x="500" y="222" font-size="13">genre</text>
  <rect class="surface hair" x="468" y="244" width="120" height="34" rx="6" stroke-width="1"/>
  <text class="ink mono" x="480" y="266" font-size="12" font-weight="600">D</text>
  <text class="muted" x="500" y="266" font-size="13">playtest</text>
  <rect class="acc-soft acc-s" x="468" y="288" width="120" height="34" rx="6" stroke-width="1.5"/>
  <text class="acc mono" x="480" y="310" font-size="12" font-weight="600">E</text>
  <text class="acc" x="500" y="310" font-size="13">feel</text>
  <rect class="surface hair" x="600" y="112" width="120" height="34" rx="6" stroke-width="1"/>
  <text class="ink mono" x="612" y="134" font-size="12" font-weight="600">F</text>
  <text class="muted" x="632" y="134" font-size="13">sound</text>
  <rect class="surface hair" x="600" y="156" width="120" height="34" rx="6" stroke-width="1"/>
  <text class="ink mono" x="612" y="178" font-size="12" font-weight="600">G</text>
  <text class="muted" x="632" y="178" font-size="13">tech</text>
  <rect class="surface hair" x="600" y="200" width="120" height="34" rx="6" stroke-width="1"/>
  <text class="ink mono" x="612" y="222" font-size="12" font-weight="600">H</text>
  <text class="muted" x="632" y="222" font-size="13">input</text>
  <rect class="surface hair" x="600" y="244" width="120" height="34" rx="6" stroke-width="1"/>
  <text class="ink mono" x="612" y="266" font-size="12" font-weight="600">I</text>
  <text class="muted" x="632" y="266" font-size="13">calm</text>
  <rect class="surface hair" x="600" y="288" width="120" height="34" rx="6" stroke-width="1"/>
  <text class="ink mono" x="612" y="310" font-size="12" font-weight="600">J</text>
  <text class="muted" x="632" y="310" font-size="13">together</text>
  <path class="mut-s" d="M728 220 H760" fill="none" stroke-width="1.25" stroke-dasharray="3 5" stroke-linecap="round"/>
  <text class="faint mono" x="776" y="96" font-size="10" letter-spacing="1.5">EVERY ANSWER PASSES 5 QUESTIONS</text>
  <line class="ink-s" x1="776" y1="112" x2="1136" y2="112" stroke-width="1"/>
  <text class="faint mono" x="776" y="140" font-size="11">Q1</text>
  <text class="ink2" x="812" y="140" font-size="14">First move in 30 s, no words</text>
  <path class="acc-s" d="M1112 134 l5 5 l9 -11" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <line class="hair" x1="776" y1="156" x2="1136" y2="156" stroke-width="1"/>
  <text class="faint mono" x="776" y="184" font-size="11">Q2</text>
  <text class="ink2" x="812" y="184" font-size="14">Name the affordance gap</text>
  <path class="acc-s" d="M1112 178 l5 5 l9 -11" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <line class="hair" x1="776" y1="200" x2="1136" y2="200" stroke-width="1"/>
  <text class="faint mono" x="776" y="228" font-size="11">Q3</text>
  <text class="ink2" x="812" y="228" font-size="14">≤ 4 new things at once</text>
  <path class="acc-s" d="M1112 222 l5 5 l9 -11" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <line class="hair" x1="776" y1="244" x2="1136" y2="244" stroke-width="1"/>
  <text class="faint mono" x="776" y="272" font-size="11">Q4</text>
  <text class="ink2" x="812" y="272" font-size="14">Couple, don't add rules</text>
  <path class="acc-s" d="M1112 266 l5 5 l9 -11" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <line class="hair" x1="776" y1="288" x2="1136" y2="288" stroke-width="1"/>
  <text class="faint mono" x="776" y="316" font-size="11">Q5</text>
  <text class="ink2" x="812" y="316" font-size="14">Pre · immediate · post feedback</text>
  <path class="acc-s" d="M1112 310 l5 5 l9 -11" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <line class="hair" x1="776" y1="332" x2="1136" y2="332" stroke-width="1"/>
  <text class="faint mono" x="776" y="350" font-size="10" letter-spacing="1">GROUNDS · VERIFY · P0/P1/P2 · REJECTED</text>
</svg>
